<style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');

    .portada {
        font-family: 'DM Sans', sans-serif;
        background: #3e0303de;
        min-height: 520px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        border-radius: var(--border-radius-lg);
        padding: 48px 32px;
    }

    .portada::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 60% 30%, #3d2008 0%, transparent 60%),
            radial-gradient(ellipse at 20% 80%, #1a2f12 0%, transparent 50%);
        opacity: 0.9;
    }

    .shelf {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 80px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 4px;
        padding: 0 40px;
        opacity: 0.18;
    }

    .book-spine {
        border-radius: 2px 2px 0 0;
        flex-shrink: 0;
    }

    .content {
        position: relative;
        z-index: 2;
        text-align: center;
    }

    .icon-wrap {
        font-size: 52px;
        margin-bottom: 20px;
        display: block;
        filter: drop-shadow(0 4px 16px #67007c);
    }

    .tag {
        display: inline-block;
        background: rgba(10, 1, 29, 0.15);
        color: #1f051f;
        border: 1px solid rgba(10, 27, 53, 0.3);
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        padding: 4px 14px;
        border-radius: 20px;
        margin-bottom: 18px;
    }

    .title {
        font-family: 'Playfair Display', serif;
        font-size: 44px;
        font-weight: 700;
        color: #f8f8f8;
        line-height: 1.1;
        margin-bottom: 10px;
    }

    .title span {
        color: #252422;
    }

    .subtitle {
        font-size: 13px;
        color: rgba(245, 233, 232, 0.812);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 36px;
    }

    .divider {
        width: 48px;
        height: 1px;
        background: rgba(212, 168, 83, 0.4);
        margin: 0 auto 36px;
    }

    .login-box {
        background: rgba(245, 240, 232, 0.05);
        border: 1px solid rgba(245, 240, 232, 0.1);
        border-radius: 14px;
        padding: 28px 32px;
        width: 320px;
        backdrop-filter: blur(4px);
    }

    .login-label {
        font-size: 11px;
        color: rgba(245, 240, 232, 0.4);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 8px;
        display: block;
        text-align: left;
    }

    .login-input {
        width: 100%;
        background: rgba(255, 255, 255, 0.06) !important;
        border: 1px solid rgba(245, 240, 232, 0.15) !important;
        border-radius: 8px !important;
        color: #f5f0e8 !important;
        font-size: 13px !important;
        padding: 9px 13px !important;
        margin-bottom: 14px;
        font-family: 'DM Sans', sans-serif;
        box-sizing: border-box;
        outline: none;
        transition: border 0.2s;
    }

    .login-input::placeholder {
        color: rgba(245, 240, 232, 0.25);
    }

    .login-input:focus {
        border-color: rgba(212, 168, 83, 0.5) !important;
    }

    .login-btn {
        width: 100%;
        background: #c17f3e;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px;
        font-family: 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        letter-spacing: 0.04em;
        transition: background 0.2s;
        margin-top: 4px;
    }

    .login-btn:hover {
        background: #a06832;
    }

    .footer-note {
        margin-top: 24px;
        font-size: 11px;
        color: rgba(245, 240, 232, 0.2);
        letter-spacing: 0.05em;
    }
</style>

<div class="portada">
    <div class="shelf">
        <div class="book-spine" style="width:18px;height:60px;background:#c17f3e"></div>
        <div class="book-spine" style="width:14px;height:72px;background:#7a8c6e"></div>
        <div class="book-spine" style="width:20px;height:55px;background:#c4896f"></div>
        <div class="book-spine" style="width:12px;height:68px;background:#d4a853"></div>
        <div class="book-spine" style="width:16px;height:50px;background:#7a8c6e"></div>
        <div class="book-spine" style="width:22px;height:75px;background:#c17f3e"></div>
        <div class="book-spine" style="width:10px;height:62px;background:#c4896f"></div>
        <div class="book-spine" style="width:18px;height:58px;background:#d4a853"></div>
        <div class="book-spine" style="width:14px;height:70px;background:#7a8c6e"></div>
        <div class="book-spine" style="width:20px;height:65px;background:#c17f3e"></div>
        <div class="book-spine" style="width:16px;height:52px;background:#c4896f"></div>
        <div class="book-spine" style="width:12px;height:78px;background:#d4a853"></div>
        <div class="book-spine" style="width:18px;height:60px;background:#7a8c6e"></div>
    </div>

    <div class="content">
        <span class="icon-wrap"></span>
        <div class="tag">Sistema</div>
        <div class="title">Compra<span>tu</span>Coquito</div>
        <div class="subtitle">Librería & punto de venta de articulos de oficina</div>
        <div class="divider"></div>

        <div class="login-box">
            <label class="login-label">Usuario</label>
            <input class="login-input" type="text" placeholder="nombre@libreria.com" />
            <label class="login-label">Contraseña</label>
            <input class="login-input" type="password" placeholder="••••••••" />
            <button class="login-btn" onclick="alert('Módulo de autenticación en desarrollo')">
                Ingresar al sistema
            </button>
        </div>

        <div class="footer-note"> Libreria compra tu coquito! &nbsp;·&nbsp;</div>
    </div>
</div>
